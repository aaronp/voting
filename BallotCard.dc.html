<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="perspective:1200px;width:100%">
  <div style="position:relative;height:290px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform:{{ c.rot }}">
    <div style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:{{ c.border }};border-radius:12px;box-shadow:{{ c.ring }};padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--faint)">#{{ c.num }}</span>
        <sc-if value="{{ c.mine }}"><span style="font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:var(--accent);color:var(--on-ink)">YOU</span></sc-if>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <sc-if value="{{ c.anon }}"><svg width="64" height="64" viewBox="0 0 100 100"><path d="{{ c.blobA }}" fill="{{ c.c1 }}"></path><path d="{{ c.blobB }}" fill="{{ c.c2 }}" transform="translate(50 50) scale(0.5) translate(-50 -50)"></path></svg></sc-if>
        <sc-if value="{{ c.named }}"><span style="width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;background:{{ c.avBg }};color:{{ c.avFg }}">{{ c.initials }}</span></sc-if>
        <span style="font-size:13px;font-weight:600;text-align:center">{{ c.label }}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;font-size:12px">
        <div style="display:flex;justify-content:space-between;gap:6px"><span style="color:var(--faint)">Allocation</span><span style="font-weight:600;color:{{ c.spentColor }};text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="{{ c.spentText }}">{{ c.spentText }}</span></div>
        <div style="display:flex;justify-content:space-between;gap:6px"><span style="color:var(--faint)">Signature</span><span style="font-weight:600;color:{{ c.sigColor }}">{{ c.sigText }}</span></div>
        <div style="display:flex;justify-content:space-between;gap:6px"><span style="color:var(--faint)">SAID</span><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ c.leafColor }}">{{ c.leafShort }}</span></div>
      </div>
      <button onClick="{{ c.flip }}" style="border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:{{ c.flipCursor }};color:{{ c.flipColor }}">{{ c.flipLabel }}</button>
    </div>
    <div style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);background:#1f2227;color:#eeece6;border-radius:12px;border:{{ c.backBorder }};padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;font-weight:600">Entry #{{ c.num }} · {{ c.kind }}</span>
        <button onClick="{{ c.flip }}" style="background:#33363d;border:none;border-radius:6px;padding:3px 8px;font-size:11.5px;color:#eeece6;cursor:pointer;font-family:inherit">↺ Flip</button>
      </div>
      <sc-for list="{{ c.fields }}" as="f">
        <label style="display:flex;flex-direction:column;gap:2px">
          <span style="font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:{{ f.labelColor }}">{{ f.label }}</span>
          <input value="{{ f.value }}" onChange="{{ f.onChange }}" readOnly="{{ f.ro }}" spellCheck="false" style="width:100%;box-sizing:border-box;font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:4px 6px;border-radius:5px;outline:none;background:{{ f.bg }};color:{{ f.fg }};border:{{ f.border }}">
        </label>
      </sc-for>
      <sc-if value="{{ c.hasOpen }}">
        <div style="margin-top:auto;padding:6px 7px;border-radius:6px;background:#2b2f35;font-size:10.5px;line-height:1.35;display:flex;flex-direction:column;gap:2px">
          <span style="color:var(--faint-2)">Only you see this: {{ c.choice }}</span>
          <span style="font-weight:600;color:{{ c.openColor }}">{{ c.openText }}</span>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:290},&quot;c&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
